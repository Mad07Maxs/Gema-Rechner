<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GEMA Rechner - Amateurtheater (Tarif BM I)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .result { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 4px; border-left: 4px solid #0056b3; }
        .result p { margin: 8px 0; font-size: 15px; }
        .total { font-weight: bold; font-size: 18px; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>GEMA-Kostenrechner (Theater)</h2>
    
    <div class="form-group">
        <label for="gemaNetto">GEMA-Vergütung (netto in €):</label>
        <input type="number" id="gemaNetto" value="24.91" step="0.01" oninput="berechneGema()">
    </div>

    <div class="form-group">
        <label for="bdatRabatt">BDAT / GSVT-Nachlass (netto in €):</label>
        <input type="number" id="bdatRabatt" value="9.96" step="0.01" oninput="berechneGema()">
    </div>

    <div class="result">
        <p>GEMA Vergütung: <span id="resGema">24,91</span> €[span_0](start_span)[span_0](end_span)</p>
        <p>GVL Vergütung (100%): <span id="resGvl">24,91</span> €[span_1](start_span)[span_1](end_span)</p>
        <p>Zwischensumme netto: <span id="resZwischen">39,86</span> €[span_2](start_span)[span_2](end_span)</p>
        <p>Umsatzsteuer (7%): <span id="resMwst">2,79</span> €</p>
        <p class="total">Gesamtbetrag (brutto): <span id="resBrutto">42,65</span> €</p>
    </div>
</div>

<script>
function berechneGema() {
    let gema = parseFloat(document.getElementById('gemaNetto').value) || 0;
    let rabatt = parseFloat(document.getElementById('bdatRabatt').value) || 0;
    
    // GVL entspricht immer 100% der GEMA-Vergütung laut Rechnung
    let gvl = gema; 
    
    let zwischensumme = (gema + gvl) - rabatt;
    if (zwischensumme < 0) zwischensumme = 0;
    
    let mwst = zwischensumme * 0.07;
    let brutto = zwischensumme + mwst;

    document.getElementById('resGema').innerText = gema.toFixed(2).replace('.', ',');
    document.getElementById('resGvl').innerText = gvl.toFixed(2).replace('.', ',');
    document.getElementById('resZwischen').innerText = zwischensumme.toFixed(2).replace('.', ',');
    document.getElementById('resMwst').innerText = mwst.toFixed(2).replace('.', ',');
    document.getElementById('resBrutto').innerText = brutto.toFixed(2).replace('.', ',');
}

// Initialer Aufruf
berechneGema();
</script>

</body>
</html>
